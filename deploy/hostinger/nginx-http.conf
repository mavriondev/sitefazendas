# Preparação HTTP: não publica o aplicativo antes de ele estar instalado.
# Instalar como /etc/nginx/sites-available/fazendasgramogol.
server {
    listen 80;
    server_name fazendasgramogol.com.br www.fazendasgramogol.com.br;

    access_log /var/log/nginx/fazendasgramogol.access.log;
    error_log /var/log/nginx/fazendasgramogol.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fazendasgramogol-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503 "Gramogol Fazendas - dominio em preparacao.\n";
    }
}
